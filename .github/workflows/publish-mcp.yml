name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['servers/*/server.json']
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish each server
        run: |
          fail=0
          for d in servers/*/; do
            [ -f "$d/server.json" ] || continue
            echo "== $d"
            out=$(cd "$d" && ../../mcp-publisher publish 2>&1); rc=$?; echo "$out"
            if [ $rc -ne 0 ]; then echo "$out" | grep -q "duplicate version" && echo "SKIP: version already published" || { echo "FAILED: $d"; fail=1; }; fi
          done
          exit $fail
